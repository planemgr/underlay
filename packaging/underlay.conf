# Settings of the underlay daemon, read by its systemd unit (or OpenRC service
# on Alpine). Uncomment what you set: a variable that is present but empty is an
# error, not the default.
#
# See /usr/share/doc/underlay/README.md

# Required: ul2:<32 random bytes, base64>:<mesh CIDR>, the same on every node
#UNDERLAY_JOIN_TOKEN=

# Unique in the cluster, a DNS label. Defaults to the host name
#UNDERLAY_NAME=

# Extra addresses peers can dial, comma separated (a 1:1 NAT's public IP)
#UNDERLAY_ADVERTISE=

#UNDERLAY_INTERFACE=underlay0
#UNDERLAY_LISTEN_PORT=51820
#UNDERLAY_ADMISSION_PORT=51821
#UNDERLAY_API_PORT=51822
#UNDERLAY_ADMISSION_PER_MINUTE=30

# host:port,... for a private DHT. Defaults to the public Mainline nodes
#UNDERLAY_DHT_BOOTSTRAP=
