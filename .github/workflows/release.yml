name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    env:
      NFPM_VERSION: 2.47.0
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch: amd64
            nfpm: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: arm64
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }} --bin underlay

      - name: Package
        run: |
          name=underlay-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/underlay README.md LICENSE THIRD-PARTY-LICENSES "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Install nfpm
        run: |
          base=https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}
          file=nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/checksums.txt" | grep " $file\$" | sha256sum -c -
          sudo tar -xzf "$file" -C /usr/local/bin nfpm
          rm "$file"

      - name: Build deb, rpm and apk packages
        env:
          ARCH: ${{ matrix.arch }}
          BINARY: target/${{ matrix.target }}/release/underlay
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          mkdir dist
          for packager in deb rpm apk; do
            nfpm package --config nfpm.yaml --packager "$packager" --target dist/
          done
          for f in dist/*; do
            sha256sum "$f" | sed 's|dist/||' > "$f.sha256"
          done
          mv dist/* .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            underlay-*.tar.gz*
            underlay*.deb*
            underlay*.rpm*
            underlay*.apk*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes underlay*
        env:
          GH_TOKEN: ${{ github.token }}
